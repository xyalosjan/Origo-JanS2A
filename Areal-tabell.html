<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Mattekoding-hjelper (VG4)</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem 1.5rem;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            font-size: 1.1rem;
            margin: 0.3rem 0 0.8rem 0;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }
        button:hover {
            background: #444;
        }
        #resultat {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1.1rem;
        }
        #forklaringer {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        code {
            background: #eee;
            padding: 0 0.2rem;
            border-radius: 3px;
        }
        .tips {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- LOGO -->
    <div style="text-align:center; margin-bottom: 1rem;">
        <img src="logo.svg"
             alt="Mattekoding-logo"
             style="height:60px;">
    </div>

    <h1>Mattekoding-hjelper</h1>
    <p>
        Skriv inn et matteuttrykk (for eksempel <code>3*(2+5)/4</code> eller <code>2**3 + 5</code>) og trykk
        <strong>Regn ut</strong>.
    </p>

    <label for="uttrykk">Uttrykk:</label>
    <input type="text" id="uttrykk" placeholder="Skriv f.eks. (10+5)*3 / 2">

    <button onclick="kjorUttrykk()">Regn ut</button>

    <p class="tips">
        Tips: <code>+</code> = pluss, <code>-</code> = minus, <code>*</code> = gange, <code>/</code> = dele,
        <code>**</code> = opphøyd i (poteser), parenteser <code>( )</code> styrer rekkefølgen.
    </p>

    <div id="resultat">Resultat kommer her.</div>
    <div id="forklaringer"></div>

    <script>
        // Regner ut uttrykket med JavaScript
        function evaluerUttrykk(str) {
            // Lager en ny funksjon som returnerer uttrykket
            const f = new Function("return (" + str + ");");
            return f();
        }

        // Sjekker hvilke operatorer som er brukt, og forklarer dem
        function lagForklaringer(str) {
            const forklaringer = [];

            if (str.includes("+")) {
                forklaringer.push("<li><code>+</code> : addisjon (pluss, legge til)</li>");
            }
            if (str.includes("-")) {
                forklaringer.push("<li><code>-</code> : subtraksjon (minus, trekke fra)</li>");
            }
            if (str.includes("*")) {
                forklaringer.push("<li><code>*</code> : multiplikasjon (ganging)</li>");
            }
            if (str.includes("/")) {
                forklaringer.push("<li><code>/</code> : divisjon (deling)</li>");
            }
            if (str.includes("**")) {
                forklaringer.push("<li><code>**</code> : potens (for eksempel <code>2**3 = 8</code>)</li>");
            }
            if (str.includes("%")) {
                forklaringer.push("<li><code>%</code> : rest ved divisjon (modulus)</li>");
            }
            if (str.includes("(") || str.includes(")")) {
                forklaringer.push("<li><code>( )</code> : parenteser som bestemmer rekkefølgen på regningen</li>");
            }
            if (str.includes("Math.sqrt")) {
                forklaringer.push("<li><code>Math.sqrt(x)</code> : kvadratroten av x (for eksempel <code>Math.sqrt(9) = 3</code>)</li>");
            }

            if (forklaringer.length === 0) {
                return "<p>Ingen spesielle operatorer funnet, bare tall.</p>";
            }

            return "<h3>Forklaring på kodene du brukte</h3><ul>" + forklaringer.join("") + "</ul>";
        }

        function kjorUttrykk() {
            const input = document.getElementById("uttrykk");
            const resultatDiv = document.getElementById("resultat");
            const forklaringerDiv = document.getElementById("forklaringer");

            const tekst = input.value.trim();

            if (!tekst) {
                resultatDiv.textContent = "Skriv inn et uttrykk først.";
                forklaringerDiv.innerHTML = "";
                return;
            }

            try {
                const resultat = evaluerUttrykk(tekst);
                resultatDiv.textContent = "Resultat: " + resultat;
                forklaringerDiv.innerHTML = lagForklaringer(tekst);
            } catch (e) {
                resultatDiv.textContent = "Det er en feil i uttrykket (sjekk parenteser, tall og tegn).";
                forklaringerDiv.innerHTML = "";
            }
        }

        // Kjør med Enter-tasten også
        document.getElementById("uttrykk").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                kjorUttrykk();
            }
        });
    </script>
</body>
</html>
