<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>karrierequiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 30%, #764ba2 70%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo-container img {
      max-width: 100px;
      height: auto;
      display: block;
    }
    .quiz-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 700px;
      width: 100%;
      padding: 40px;
      margin-top: 140px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
      width: 0%;
    }
    .question-container {
      margin-bottom: 30px;
    }
    .question-number {
      color: #667eea;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .question-text {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option:hover {
      background: #f0f0f0;
      border-color: #667eea;
      transform: translateX(4px);
    }
    .option.selected {
      background: #e8eaff;
      border-color: #667eea;
      font-weight: 500;
    }
    .option-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option.selected .option-checkbox {
      background: #667eea;
      border-color: #667eea;
    }
    .option.selected .option-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .hidden {
      display: none;
    }
    .result-container {
      text-align: center;
    }
    .result-title {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }
    .result-profile {
      font-size: 24px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .profile-description {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      text-align: left;
    }
    .profile-description h3 {
      color: #667eea;
      margin-bottom: 12px;
      font-size: 18px;
    }
    .profile-description p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .profile-description ul {
      margin-left: 20px;
      color: #555;
      line-height: 1.8;
    }
    .profile-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .keyword {
      background: #e8eaff;
      color: #667eea;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .chart-container {
      margin: 30px 0;
    }
    .chart-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .chart-label {
      flex: 0 0 150px;
      text-align: right;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    .chart-bar-bg {
      flex: 1;
      background: #e0e0e0;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }
    .chart-percent {
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 24px;
      }
      h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 18px;
      }
      .chart-label {
        flex: 0 0 100px;
        font-size: 12px;
      }
    }
  </style>
</head>

    let currentQ = 0;
    let scores = { practical: 0, investigative: 0, artistic: 0, social: 0, enterprising: 0, conventional: 0 };
    let selectedOption = null;

    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-number').textContent = `Spørsmål ${currentQ + 1} av ${questions.length}`;
      document.getElementById('question-text').textContent = q.q;
      
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      
      q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<div class="option-checkbox"></div><span>${opt.text}</span>`;
        div.onclick = () => selectOption(i);
        optionsDiv.appendChild(div);
      });
      
      selectedOption = null;
      document.getElementById('next-btn').disabled = true;
      updateProgress();
    }

    function selectOption(index) {
      document.querySelectorAll('.option').forEach((o, i) => {
        o.classList.toggle('selected', i === index);
      });
      selectedOption = index;
      document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
      if (selectedOption === null) return;
      
      const opt = questions[currentQ].opts[selectedOption];
      for (let key in opt.p) {
        scores[key] += opt.p[key];
      }
      
      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function updateProgress() {
      const percent = (currentQ / questions.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const topProfile = profiles[sorted[0]];
      
      document.getElementById('top-profile').textContent = topProfile.name;
      
      let detailsHTML = `
        <div class="profile-description">
          <h3>Din profil</h3>
          <p>${topProfile.desc}</p>
          <h3 style="margin-top: 16px;">Typisk deg:</h3>
          <ul>
            ${topProfile.traits.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
        
        <div class="profile-keywords">
          ${topProfile.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}
        </div>
        
        <div class="profile-description">
          <h3>Studieretninger som passer deg:</h3>
          <ul>
            ${topProfile.studies.map(s => `<li>${s}</li>`).join('')}
          </ul>
        </div>
      `;
      
      if (sorted.length > 1) {
        detailsHTML += `
          <div class="profile-description" style="background: #fff3e0; border-left: 4px solid #ff9800;">
            <h3>Andre retninger som også passer:</h3>
            <p><strong>${profiles[sorted[1]].name}</strong>: ${profiles[sorted[1]].desc}</p>
          </div>
        `;
      }
      
      document.getElementById('profile-details').innerHTML = detailsHTML;
      
      const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);
      let chartHTML = '<div class="chart-container"><h3 style="text-align:center;margin-bottom:20px;">Din interesseprofil</h3>';
      
      for (let key of sorted) {
        const percent = Math.round((scores[key] / totalScore) * 100);
        chartHTML += `
          <div class="chart-bar">
            <div class="chart-label">${profiles[key].name}</div>
            <div class="chart-bar-bg">
              <div class="chart-bar-fill" style="width: ${percent}%">
                <span class="chart-percent">${percent}%</span>
              </div>
            </div>
          </div>
        `;
      }
      chartHTML += '</div>';
      document.getElementById('chart').innerHTML = chartHTML;
    }

    loadQuestion();
  </script>
</body>
</html>
