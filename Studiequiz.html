<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karrierequiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 60%, #764ba2 40%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo-container img {
      max-width: 200px;
      height: auto;
      display: block;
    }
    .quiz-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 700px;
      width: 100%;
      padding: 40px;
      margin-top: 140px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
      width: 0%;
    }
    .question-container {
      margin-bottom: 30px;
    }
    .question-number {
      color: #667eea;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .question-text {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option:hover {
      background: #f0f0f0;
      border-color: #667eea;
      transform: translateX(4px);
    }
    .option.selected {
      background: #e8eaff;
      border-color: #667eea;
      font-weight: 500;
    }
    .option-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option.selected .option-checkbox {
      background: #667eea;
      border-color: #667eea;
    }
    .option.selected .option-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .hidden {
      display: none;
    }
    .result-container {
      text-align: center;
    }
    .result-title {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }
    .result-profile {
      font-size: 24px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .result-subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }
    .profile-description {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: left;
    }
    .profile-description h3 {
      color: #667eea;
      margin-bottom: 12px;
      font-size: 18px;
    }
    .profile-description p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .profile-description ul {
      margin-left: 20px;
      color: #555;
      line-height: 1.8;
    }
    .profile-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .keyword {
      background: #e8eaff;
      color: #667eea;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .chart-container {
      margin: 20px 0 10px 0;
    }
    .chart-bar {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 12px;
    }
    .chart-label {
      flex: 0 0 150px;
      text-align: right;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    .chart-bar-bg {
      flex: 1;
      background: #e0e0e0;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }
    .chart-percent {
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .studies-note {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    .studies-list {
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .next-steps {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
    .next-steps ul {
      margin-left: 20px;
      line-height: 1.7;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 24px;
      }
      h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 18px;
      }
      .chart-label {
        flex: 0 0 100px;
        font-size: 12px;
      }
    }
  </style>
</head>

  <div class="logo-container">

      <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Neste</button>
      <button class="btn" id="back-btn" onclick="prevQuestion()" style="margin-top:10px;background:#e0e0e0;color:#333;">Tilbake</button>
    </div>

    <div id="result-screen" class="hidden result-container">

      <div class="result-profile" id="top-profile"></div>
      <div class="result-subtitle" id="top-subtitle"></div>
      <div id="profile-details"></div>
      <div id="chart"></div>
      <button class="btn" onclick="location.reload()">Ta quizen på nytt</button>

    let currentQ = 0;
    let scores = { practical: 0, investigative: 0, artistic: 0, social: 0, enterprising: 0, conventional: 0 };
    let selectedIndices = [];
    let regionPreference = 'any';
    let answers = []; // lagrer svar per spørsmål

    function isRegionQuestion() {
      const q = questions[currentQ];
      return q.opts.length && q.opts[0].region;
    }

    function loadQuestion(restore = false) {
      const q = questions[currentQ];
      document.getElementById('question-number').textContent = `Spørsmål ${currentQ + 1} av ${questions.length}`;
      document.getElementById('question-text').textContent = q.q;

      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      const regionQ = isRegionQuestion();

      q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<div class="option-checkbox"></div><span>${opt.text}</span>`;
        div.onclick = () => selectOption(i);
        optionsDiv.appendChild(div);
      });

      if (!regionQ) {
        const unsureIndex = q.opts.length;
        const unsureDiv = document.createElement('div');
        unsureDiv.className = 'option';
        unsureDiv.innerHTML = `<div class="option-checkbox"></div><span>Usikker / ingen passer helt</span>`;
        unsureDiv.onclick = () => selectOption(unsureIndex);
        optionsDiv.appendChild(unsureDiv);
      }

      selectedIndices = [];
      document.getElementById('next-btn').disabled = true;

      if (restore && answers[currentQ] && answers[currentQ].length) {
        const prevSel = answers[currentQ];
        const opts = document.querySelectorAll('.option');
        opts.forEach((o, i) => {
          if (prevSel.includes(i)) {
            o.classList.add('selected');
          }
        });
        selectedIndices = prevSel.slice();
        document.getElementById('next-btn').disabled = false;
      }

      document.getElementById('back-btn').disabled = currentQ === 0;

      updateProgress();
    }

    function selectOption(index) {
      const q = questions[currentQ];
      const regionQ = isRegionQuestion();
      const options = document.querySelectorAll('.option');

      if (regionQ) {
        selectedIndices = [index];
        options.forEach((o, i) => {
          o.classList.toggle('selected', i === index);
        });
      } else {
        const unsureIndex = q.opts.length;
        const alreadySelected = selectedIndices.includes(index);

        if (index === unsureIndex) {
          if (alreadySelected) {
            selectedIndices = [];
            options.forEach(o => o.classList.remove('selected'));
          } else {
            selectedIndices = [unsureIndex];
            options.forEach((o, i) => {
              o.classList.toggle('selected', i === unsureIndex);
            });
          }
        } else {
          const unsurePos = selectedIndices.indexOf(unsureIndex);
          if (unsurePos !== -1) {
            selectedIndices.splice(unsurePos, 1);
            options[unsureIndex].classList.remove('selected');
          }

          if (alreadySelected) {
            selectedIndices = selectedIndices.filter(i => i !== index);
            options[index].classList.remove('selected');
          } else {
            selectedIndices.push(index);
            options[index].classList.add('selected');
          }
        }
      }

      document.getElementById('next-btn').disabled = selectedIndices.length === 0;
    }

    function recomputeScores() {
      scores = { practical: 0, investigative: 0, artistic: 0, social: 0, enterprising: 0, conventional: 0 };
      regionPreference = 'any';

      for (let qIndex = 0; qIndex < answers.length; qIndex++) {
        const sel = answers[qIndex];
        if (!sel || !sel.length) continue;

        const q = questions[qIndex];
        const regionQ = q.opts.length && q.opts[0].region;

        if (regionQ) {
          const opt = q.opts[sel[0]];
          if (opt.region) {
            regionPreference = opt.region;
          }
        } else {
          const unsureIndex = q.opts.length;
          const chosen = sel.filter(i => i !== unsureIndex);
          if (chosen.length > 0) {
            const weightFactor = 1 / chosen.length;
            chosen.forEach(i => {
              const opt = q.opts[i];
              for (let key in opt.p) {
                scores[key] += opt.p[key] * weightFactor;
              }
            });
          }
        }
      }
    }

    function nextQuestion() {
      if (!selectedIndices.length) return;

      answers[currentQ] = selectedIndices.slice();
      recomputeScores();

      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion(true);
      } else {
        document.getElementById('progress').style.width = '100%';
        showResults();
      }
    }

    function prevQuestion() {
      if (currentQ === 0) return;

      answers[currentQ] = selectedIndices.slice();

      currentQ--;
      loadQuestion(true);
    }

    function updateProgress() {
      const percent = (currentQ / questions.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function generateStudySuggestions(profileKey, limit = 220) {
      const profile = profiles[profileKey];
      const degreePrefixes = [
        'Årsstudium i ',
        'Bachelor i ',
        'Master i '
      ];
      const suggestions = [];

      if (profile.favorites && profile.favorites.length) {
        profile.favorites.forEach(s => suggestions.push(s));
      }

      if (profile.baseFields && profile.baseFields.length) {
        profile.baseFields.forEach(field => {
          degreePrefixes.forEach(pref => {
            suggestions.push(pref + field);
          });
        });
      }

      const unique = Array.from(new Set(suggestions));
      return unique.slice(0, limit);
    }

    function getRegionText(regionKey) {
      switch (regionKey) {
        case 'oslo':
          return `
            <h3>Områdevalg: Oslo / Oslo-området</h3>
            <p>Du har valgt Oslo-området. Det finnes mange universiteter og høyskoler her, for eksempel Universitetet i Oslo, OsloMet, BI, Høyskolen Kristiania, Norges idrettshøgskole, Kunsthøgskolen i Oslo, MF og flere andre.</p>
            <p>Fordeler: stort fagtilbud, mange jobber og praksismuligheter, aktivt studentmiljø. Ulemper: høyere bokostnader og mer konkurranse om boliger.</p>
          `;
        case 'southeast':
          return `
            <h3>Områdevalg: Sørøstlandet (Telemark, Vestfold, Buskerud osv.)</h3>
            <p>Du har valgt Sørøstlandet. Universitetet i Sørøst-Norge (USN) har campuser blant annet i Bø, Porsgrunn, Notodden, Rauland, Drammen, Hønefoss, Kongsberg og Vestfold, i tillegg til flere mindre studiesteder i regionen.</p>
            <p>Fordeler: litt lavere bokostnader enn Oslo, fortsatt bra fagtilbud og gode pendlermuligheter for mange. Passer godt hvis du vil kombinere studier med litt roligere omgivelser.</p>
          `;
        case 'west_trondelag':
          return `
            <h3>Områdevalg: Vestlandet / Trøndelag</h3>
            <p>Du har valgt Vestlandet/Trøndelag. Typiske studiesteder her er Universitetet i Bergen (UiB), Høgskulen på Vestlandet (HVL), NTNU i Trondheim, samt flere høyskoler og nisjeuniversiteter.</p>
            <p>Fordeler: sterke miljø innen teknologi, realfag, økonomi, media og lærerutdanning, og veldig aktive studentbyer (særlig Bergen og Trondheim).</p>
          `;
        case 'north':
          return `
            <h3>Områdevalg: Nord-Norge</h3>
            <p>Du har valgt Nord-Norge. Aktuelle læresteder er UiT – Norges arktiske universitet (campus Tromsø, Harstad, Alta, Narvik m.fl.) og Nord universitet (bl.a. i Bodø og flere andre steder i nord).</p>
            <p>Fordeler: nærhet til natur, mindre campusmiljøer med tett oppfølging og særskilte fag innen helse, lærer, beredskap, arktiske fag m.m.</p>
          `;
        default:
          return `
            <h3>Områdevalg: Fleksibel / hele Norge</h3>
            <p>Du har valgt at sted ikke er så viktig. Det gir deg maksimal frihet til å lete etter studier over hele landet – fra Oslo, via Sørøstlandet og Vestlandet, til Trøndelag og Nord‑Norge.</p>
            <p>Bruk fagfeltene under som søkeord på utdanning.no og Samordna opptak, og filtrer etter by/region når du vet mer om hvor du vil bo.</p>
          `;
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const topKey = sorted[0];
      const topProfile = profiles[topKey];

      document.getElementById('top-profile').textContent = topProfile.name;

      const secondKey = sorted[1];
      const thirdKey = sorted[2];
      let subtitle = `Sterkest profil: ${topProfile.name}`;
      if (secondKey) {
        subtitle += ` · Nest sterk: ${profiles[secondKey].name}`;
      }
      if (thirdKey) {
        subtitle += ` · Også tydelig: ${profiles[thirdKey].name}`;
      }
      document.getElementById('top-subtitle').textContent = subtitle;

      const topStudies = generateStudySuggestions(topKey, 220);

      let detailsHTML = `
        <div class="profile-description">
          <h3>Din interesseprofil</h3>
          <p>${topProfile.desc}</p>
          <h3 style="margin-top: 16px;">Typisk deg:</h3>
          <ul>
            ${topProfile.traits.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
        
        <div class="profile-keywords">
          ${topProfile.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}
        </div>
        
        <div class="profile-description">
          <h3>Studieretninger som passer deg (universitet / høyskole / fagskole):</h3>
          <div class="studies-list">
            <ul>
              ${topStudies.map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>
          <p class="studies-note">
            Listen viser et utvalg av mange mulige studier basert på interesseprofilen din. Sjekk Samordna opptak og aktuelle høyskoler/universiteter for detaljerte tilbud.
          </p>
        </div>
      `;

      if (secondKey) {
        const secondProfile = profiles[secondKey];
        const secondStudies = generateStudySuggestions(secondKey, 80);
        detailsHTML += `
          <div class="profile-description" style="background: #fff3e0; border-left: 4px solid #ff9800;">
            <h3>Andre retninger som også passer deg (${secondProfile.name}):</h3>
            <p>${secondProfile.desc}</p>
            <ul>
              ${secondStudies.map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      if (thirdKey) {
        const thirdProfile = profiles[thirdKey];
        const thirdStudies = generateStudySuggestions(thirdKey, 40);
        detailsHTML += `
          <div class="profile-description" style="background: #e3f2fd; border-left: 4px solid #2196f3;">
            <h3>Flere mulige veier (${thirdProfile.name}):</h3>
            <p>${thirdProfile.desc}</p>
            <ul>
              ${thirdStudies.map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      detailsHTML += `
        <div class="profile-description">
          ${getRegionText(regionPreference)}
          <div class="next-steps">
            <h3>Neste steg for deg</h3>
            <ul>
              <li>Bruk 3–5 av studie-forslagene over som søkeord på utdanning.no og Samordna opptak.</li>
              <li>Sjekk nettsidene til aktuelle universiteter/høyskoler i området du har valgt.</li>
              <li>Sammenlign opptakskrav (karakterer, realfag osv.) og noter hva du allerede oppfyller.</li>
              <li>Snakk med rådgiver på skolen eller oppsøk digital veiledning for å spisse valgene dine.</li>
            </ul>
          </div>
        </div>
      `;
      
      document.getElementById('profile-details').innerHTML = detailsHTML;
      
      const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);
      let chartHTML = '<div class="chart-container"><h3 style="text-align:center;margin-bottom:10px;">Din interesseprofil (fordeling)</h3>';
      
      for (let key of sorted) {
        const percent = totalScore > 0 ? Math.round((scores[key] / totalScore) * 100) : 0;
        chartHTML += `
          <div class="chart-bar">
            <div class="chart-label">${profiles[key].name}</div>
            <div class="chart-bar-bg">
              <div class="chart-bar-fill" style="width: ${percent}%">
                <span class="chart-percent">${percent}%</span>
              </div>
            </div>
          </div>
        `;
      }
      chartHTML += '</div>';
      document.getElementById('chart').innerHTML = chartHTML;
    }

    loadQuestion();
